<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>hiq</title>
    <style>
      /* Splash screen shown while JS loads — replaced by React once mounted */
      body { margin: 0; background: #1a1a2e; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #1a1a2e; color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash .logo { font-size: 48px; margin-bottom: 16px; }
      #splash .name { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
      #splash .sub { font-size: 14px; opacity: 0.6; margin-bottom: 24px; }
      #splash .dots { display: flex; gap: 8px; }
      #splash .dots span {
        width: 8px; height: 8px; border-radius: 50%;
        background: #6366f1;
        animation: pulse 1.4s ease-in-out infinite;
      }
      #splash .dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">🤖</div>
      <div class="name">Hiq</div>
      <div class="sub">Universal AI Assistant</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
