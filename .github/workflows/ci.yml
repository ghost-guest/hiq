# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
          - os: macos-14
            goos: darwin
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: |
          go mod tidy
          cd desktop && go mod tidy
          
      - name: Install system dependencies (Linux)
        if: ${{ matrix.goos == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Locale parity gate (WORKSPACE_GIT_SPEC F2): en/zh key-set equality and
      # "zh values must not be untranslated English sentences". One matrix leg
      # only — the check is OS-independent; the full npm test suite is not yet
      # validated on CI runners.
      - name: Locale parity guard
        if: ${{ matrix.goos == 'linux' && matrix.goarch == 'amd64' }}
        working-directory: desktop/frontend
        run: |
          npm ci
          npx vitest run src/__tests__/locale-parity.test.ts
        
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -trimpath -webview2 embed -nsis
          elif [ "${{ matrix.goos }}" = "linux" ]; then
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -trimpath -tags webkit2_41
          else
            wails build -platform ${{ matrix.goos }}/${{ matrix.goarch }} -clean -trimpath
          fi

      - name: Determine Artifact Name
        id: artifact_name
        shell: bash
        run: |
          echo "name=${{ matrix.goos }}-${{ matrix.goarch }}" >> $GITHUB_OUTPUT

      - name: Compress Build Output
        working-directory: desktop/build/bin
        shell: bash
        run: |
          ARTIFACT_NAME="hiq-${{ steps.artifact_name.outputs.name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${ARTIFACT_NAME}.zip" *
            find . -mindepth 1 -maxdepth 1 ! -name "*.zip" -exec rm -rf {} +
          else
            tar -czf "${ARTIFACT_NAME}.tar.gz" *
            find . -mindepth 1 -maxdepth 1 ! -name "*.tar.gz" -exec rm -rf {} +
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiq-${{ steps.artifact_name.outputs.name }}
          path: |
            desktop/build/bin/*.zip
            desktop/build/bin/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Manifest
        run: |
          cd desktop
          go run ./cmd/sign manifest ../artifacts v0.1.6 v0.1.6

      - name: Create Continuous Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.1.6"
          name: "Release v0.1.6"
          body: "Automated build for version v0.1.6"
          files: artifacts/*
          prerelease: false
