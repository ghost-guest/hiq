# coturn: STUN（打洞）+ opt-in TURN relay（跨网兜底中转）。
# TURN 只转发 DTLS 加密包——coturn 无法解密业务流量（PROTOCOL §1.1 的
# "中继不可解密"底线依然成立）；跨网首连必成（对称 NAT × 对称 NAT 也通），
# ICE 优先选直连候选，relay 仅在打洞全败时启用。
#
# 凭据：use-auth-secret（REST API 模式）—— username=过期时间戳，
# password=HMAC-SHA1(static-auth-secret, username)，K/两端零状态自洽校验。
# static-auth-secret 换成自己的随机 32 字节（openssl rand -hex 32），
# 并与 hiq.toml [mobilebridge] turn_user/turn_pass 保持一致。
#
# 防火墙需开：3478/udp + 3478/tcp（STUN/TURN）+ 49160-65535/udp（relay 段）。
# 每个中转会话占 2 个 relay 端口（C、S 各一次 allocation），带宽是主要成本。

listening-port=3478
listening-ip=0.0.0.0
fingerprint
lt-cred-mech=true
use-auth-secret
static-auth-secret=CHANGE_ME_TO_RANDOM_32_BYTES
min-port=49160
max-port=65535
# VPS 在 NAT 后（无直接公网 IP）时需设置：external-ip=<公网IP>/<内网IP>
no-multicast-peers
no-cli
no-tls
no-dtls
stale-nonce=600
max-allocate-timeout=3
total-quota=1200
user-quota=12
log-file=stdout
simple-log
